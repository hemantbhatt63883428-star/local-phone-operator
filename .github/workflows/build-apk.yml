name: Build Local Phone Operator APK

on:
  push:
    branches: [ "main", "arena/01a0f02d-local-phone-operator" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.14.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Build and test
        working-directory: LocalPhoneOperator
        run: gradle :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalPhoneOperator-debug-apk
          path: LocalPhoneOperator/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
