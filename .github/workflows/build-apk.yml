name: Build Local Phone Operator APK

on:
  push:
    branches: [ "main", "arena/01a0f02d-local-phone-operator" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.14.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Build and test
        working-directory: LocalPhoneOperator
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug :app:testDebugUnitTest --stacktrace 2>&1 | tee build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            grep -E '^e:|^error:|^FAILURE:|^\* What went wrong:|^> Task .*FAILED|^\s+e:|^.*Unresolved reference|^.*Compilation error|^.*Could not resolve|^.*What went wrong' build.log | head -30 | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
            exit "$result"
          fi

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalPhoneOperator-debug-apk
          path: LocalPhoneOperator/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # The user needs a directly installable file, not only a ZIP artifact.
      # The APK is the sole generated binary committed to this branch.
      - name: Publish installable APK to this branch
        if: github.ref_name == 'arena/01a0f02d-local-phone-operator'
        run: |
          mkdir -p install
          cp LocalPhoneOperator/app/build/outputs/apk/debug/app-debug.apk install/LocalPhoneOperator-v1.2.0-debug.apk
          (cd install && sha256sum LocalPhoneOperator-v1.2.0-debug.apk > SHA256SUMS)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f install/LocalPhoneOperator-v1.2.0-debug.apk
          git add install/SHA256SUMS
          git commit -m 'Publish v1.2.0 installable debug APK [skip ci]'
          git push origin HEAD:refs/heads/arena/01a0f02d-local-phone-operator
