name: Build Local Phone Operator APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and patch source
        shell: bash
        run: |
          cat source_parts/part1.b64 source_parts/part2.b64 source_parts/part3.b64 source_parts/part4.b64 | base64 -d > LocalPhoneOperator-source.zip
          sha256sum -c SOURCE_SHA256.txt
          unzip -q LocalPhoneOperator-source.zip
          test -f LocalPhoneOperator/app/build.gradle.kts
          sed -i 's/org.jetbrains.kotlin.android") version "2.0.21"/org.jetbrains.kotlin.android") version "2.4.0"/' LocalPhoneOperator/build.gradle.kts
          perl -0pi -e 's/\n    kotlinOptions \{\n        jvmTarget = "17"\n    \}\n/\n/' LocalPhoneOperator/app/build.gradle.kts
          printf '\nkotlin {\n    compilerOptions {\n        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)\n    }\n}\n' >> LocalPhoneOperator/app/build.gradle.kts
          grep 'org.jetbrains.kotlin.android' LocalPhoneOperator/build.gradle.kts
          tail -n 8 LocalPhoneOperator/app/build.gradle.kts

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.14.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Build debug APK
        working-directory: LocalPhoneOperator
        run: gradle :app:assembleDebug --stacktrace

      - name: Run unit tests
        working-directory: LocalPhoneOperator
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalPhoneOperator-debug-apk
          path: LocalPhoneOperator/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
