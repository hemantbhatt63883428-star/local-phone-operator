name: Build Local Phone Operator APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          cat source_parts/part1.b64 source_parts/part2.b64 source_parts/part3.b64 source_parts/part4.b64 | base64 -d > LocalPhoneOperator-source.zip
          sha256sum -c SOURCE_SHA256.txt
          unzip -q LocalPhoneOperator-source.zip
          test -f LocalPhoneOperator/app/build.gradle.kts
          # LiteRT-LM 0.17.1 is published with Kotlin 2.4 metadata.
          sed -i 's/org.jetbrains.kotlin.android") version "2.0.21"/org.jetbrains.kotlin.android") version "2.4.0"/' LocalPhoneOperator/build.gradle.kts
          grep 'org.jetbrains.kotlin.android' LocalPhoneOperator/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p = Path("LocalPhoneOperator/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace('''    kotlinOptions {
        jvmTarget = "17"
    }
''', '')
          s += '''
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}
'''
          p.write_text(s)
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Build debug APK
        working-directory: LocalPhoneOperator
        run: gradle :app:assembleDebug --stacktrace

      - name: Run unit tests
        working-directory: LocalPhoneOperator
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalPhoneOperator-debug-apk
          path: LocalPhoneOperator/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
